type: object
required:
  - name
  - phoneNumber
  - contactType
properties:
  name:
    type: string
    minLength: 3
    maxLength: 30
    example: 'Thomas'
  phoneNumber:
    type: string
    description: none
    pattern: '^\+?[0-9\s\-()]+$'
    example: '+49 151 23456789'
  email:
    type: string
    format: email
    example: 'thomas@example.com'
  isFavourite:
    type: boolean
    default: false
    example: true
  contactType:
    type: string
    enum:
      - work
      - home
      - personal
    default: personal
    example: work
  photo:
    type: string
    description: URL to the contact photo
    example: 'https://res.cloudinary.com/uqwgdu/image/upload/image.png'
