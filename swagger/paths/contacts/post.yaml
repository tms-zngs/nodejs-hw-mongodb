tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact for the authenticated user. Supports JSON or multipart form with optional photo upload.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/contactCreate.yaml'
    multipart/form-data:
      schema:
        allOf:
          - $ref: '../../components/schemas/contactCreate.yaml'
          - type: object
            properties:
              photo:
                type: string
                format: binary
responses:
  '201':
    description: Successfully created contact
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created contact!
            data:
              $ref: '../../components/schemas/contact.yaml'
  '400':
    description: Validation error (missing required fields or invalid input)
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Invalid input
