tags:
  - Contacts
summary: Get contacts list
operationId: listContacts
description: Get a paginated contacts list with filters and sorting
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    description: Page number (1-based)
    schema:
      type: integer
      minimum: 1
      default: 1
  - in: query
    name: perPage
    description: Items per page
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
  - in: query
    name: sortBy
    description: Field to sort by
    schema:
      type: string
      enum: [name, createdAt, updatedAt]
      default: createdAt
  - in: query
    name: sortOrder
    description: Sort direction
    schema:
      type: string
      enum: [asc, desc]
      default: desc
responses:
  '200':
    description: Contacts list with pagination
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                [
                  data,
                  page,
                  perPage,
                  totalItems,
                  totalPages,
                  hasPreviousPage,
                  hasNextPage,
                ]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 57
                totalPages:
                  type: integer
                  example: 6
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '404':
    $ref: '../../components/responses/404.yaml'
